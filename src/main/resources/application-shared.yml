spring:
  datasource:
    url: jdbc:h2:tcp://localhost:1521/~/shared-h2;MODE=MySQL
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: none
    defer-datasource-initialization: true
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        show_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect
